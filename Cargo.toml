[workspace]
members = [
    "crates/openapi-route",
    "crates/openapi-route-macros",
    "crates/openapi-route-axum",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["DataRoad Inc, Delaware, USA, trading as Legra"]
homepage = "https://github.com/legra-ai/openapi-route"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/legra-ai/openapi-route"
rust-version = "1.85"

[workspace.dependencies]
openapi-route = { path = "crates/openapi-route", version = "0.1.1" }
openapi-route-macros = { path = "crates/openapi-route-macros", version = "0.1.1" }
http = "1.5"
serde_json = "1"
utoipa = "5.5"
axum = "0.8"
inventory = "0.3"
ureq = "3"
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
