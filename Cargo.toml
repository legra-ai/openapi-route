[workspace]
members = [
    "crates/openapi-route",
    "crates/openapi-route-macros",
    "crates/openapi-route-axum",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
openapi-route = { path = "crates/openapi-route", version = "0.1.0" }
openapi-route-macros = { path = "crates/openapi-route-macros", version = "0.1.0" }
http = "1.3"
serde_json = "1"
utoipa = "5.4"
axum = "0.8"
inventory = "0.3"
ureq = "3"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
